[project]
name = "hermes-trading"
version = "0.1.0"
description = "Paper-mode self-improving market-making worker for Hermes"
requires-python = ">=3.11"
dependencies = [
    "aiofiles>=25.1.0",
    "ccxt>=4.5.27",
    "httpx>=0.28.1",
    "lxml>=6.1.1",
    "numpy>=2.3.5",
    "pandas>=2.3.3",
    "plotly>=6.8.0",
    "pyyaml>=6.0.3",
    "rich>=14.2.0",
    "streamlit>=1.58.0",
    "yfinance>=0.2.66",
]

[dependency-groups]
dev = ["pytest>=9.0.1", "pytest-asyncio>=1.3.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["hermes_trading"]
